name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The workspace is framework-only: it builds, tests and lints without Unreal
  # Engine installed. The generated bindings live in each game's repository.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build
        run: cargo build --workspace --verbose

      - name: Test
        run: cargo test --workspace --verbose

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      # Fails on any dependency with a RustSec vulnerability advisory, in the
      # Cargo.lock the build above resolved (the lock is not versioned, so this
      # is what a build gets today). Unmaintained or yanked crates only warn.
      - name: Install cargo-audit
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit@0.22.2

      - name: Audit the dependencies
        run: cargo audit
