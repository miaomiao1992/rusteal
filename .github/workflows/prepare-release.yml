name: Prepare release

# Runs on every pull request that targets main. It works out the next version from the
# commits the PR brings and commits it to [workspace.package] ON THE PR BRANCH (develop),
# so that main receives the final version with the merge and the release workflow only has
# to publish. A push made here re-triggers this workflow, which then finds nothing to change.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: prepare-release-${{ github.head_ref }}
  cancel-in-progress: true

# The job commits the version to the pull request branch; the default token is
# read-only in a new repository.
permissions:
  contents: write
  statuses: write

env:
  CARGO_TERM_COLOR: always
  # The crate whose published version anchors the workspace: they all share one version.
  ANCHOR_CRATE: rusteal

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # A merge that changes only workflows, documentation or examples has
      # nothing to release: the packages would be identical to the ones already
      # on crates.io. Paths that end up inside a package (every crate, plus the
      # UE plugin the CLI embeds and the workspace manifest) decide it.
      - name: Is there anything to release?
        id: guard
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$LAST_TAG" ]; then
            echo "No release tag yet: releasing."
            exit 0
          fi
          CHANGED=$(git diff --name-only "$LAST_TAG..HEAD" -- \
            'rusteal-*' ue_plugin Cargo.toml)
          if [ -z "$CHANGED" ]; then
            echo "Nothing that goes into a package changed since $LAST_TAG; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Changed since $LAST_TAG:"
            echo "$CHANGED"
          fi

      # Semantic versioning: the last released version is whatever crates.io has (the only
      # source that cannot drift from reality); the commits the PR adds on top of main decide
      # the bump — "BREAKING CHANGE:" -> major, "feat:" -> minor, anything else -> patch.
      # Before the first release the anchor is not on crates.io yet: the version in
      # Cargo.toml is then taken as is.
      - name: Get next version
        id: semver
        if: steps.guard.outputs.skip != 'true'
        run: |
          git fetch origin main
          CURRENT=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          UA="rusteal-release-workflow (+https://github.com/viniciusmorgado/rusteal)"
          RELEASED=$(curl -sf -A "$UA" "https://crates.io/api/v1/crates/$ANCHOR_CRATE" \
            | grep -o '"max_version":"[^"]*"' | cut -d'"' -f4 || true)
          if [ -z "$RELEASED" ]; then
            echo "$ANCHOR_CRATE is not on crates.io yet: keeping $CURRENT for the first release."
            echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The commits since the release on crates.io, by its tag, which the
          # release workflow creates only once it has published: a merge to
          # main whose release failed is still counted.
          BASE="v$RELEASED"
          if ! git rev-parse -q --verify "refs/tags/$BASE" > /dev/null; then
            BASE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo origin/main)
          fi
          SUBJECTS=$(git log --format=%s "$BASE..HEAD" | grep -v '^chore: bump version' || true)
          if echo "$SUBJECTS" | grep -q '^BREAKING CHANGE:'; then
            BUMP=major
          elif echo "$SUBJECTS" | grep -q '^feat'; then
            BUMP=minor
          else
            BUMP=patch
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$RELEASED"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Released (crates.io): $RELEASED, commits since $BASE, bump: $BUMP, next: $VERSION"
          # Never lower the version: one already above it in Cargo.toml is not
          # on crates.io yet, and stays.
          if [ "$(printf '%s\n%s\n' "$VERSION" "$CURRENT" | sort -V | tail -n 1)" != "$VERSION" ]; then
            echo "Cargo.toml is at $CURRENT, above $VERSION: keeping $CURRENT."
            VERSION="$CURRENT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # One version for the whole workspace: [workspace.package].version, which every crate
      # inherits, and the internal dependencies that carry it for the published manifests.
      - name: Commit the version to the PR branch
        id: commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          TARGET_VERSION="${{ steps.semver.outputs.version }}"
          CURRENT_VERSION=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "Cargo.toml is already at version $TARGET_VERSION; nothing to commit."
          else
            sed -i '0,/^version = ".*"/s//version = "'"$TARGET_VERSION"'"/' Cargo.toml
            sed -i 's/{ version = "[^"]*", path =/{ version = "'"$TARGET_VERSION"'", path =/' Cargo.toml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # The plugins carry the same version (rusteal-cli/tests/plugin_version.rs):
            # VersionName as is, Version as the integer UE requires there.
            IFS=. read -r MAJOR MINOR PATCH <<< "$TARGET_VERSION"
            VERSION_INT=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
            UPLUGINS="ue_plugin/Rusteal/Rusteal.uplugin ue_plugin/RustealGenerator/RustealGenerator.uplugin"
            for UPLUGIN in $UPLUGINS; do
              sed -i -e 's/^\(\s*"Version": \)[0-9]*,$/\1'"$VERSION_INT"',/' \
                -e 's/^\(\s*"VersionName": \)"[^"]*",$/\1"'"$TARGET_VERSION"'",/' "$UPLUGIN"
            done
            git add Cargo.toml $UPLUGINS
            # [skip ci]: GitHub creates no workflow run for this commit. A run
            # it triggers is a pull request run by github-actions[bot], which
            # waits for an approval and fails when that never comes; the runs
            # of the pull request itself already checked everything else.
            git commit -m "chore: bump version to $TARGET_VERSION [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # The release workflow runs these steps after the merge, where a failure
      # leaves main ahead of crates.io. Run here, on the version the merge will
      # publish, they fail the pull request instead, before it reaches main.
      - name: Test
        if: steps.guard.outputs.skip != 'true'
        run: cargo test --workspace

      - name: Clippy
        if: steps.guard.outputs.skip != 'true'
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

      # The same audit as CI, on the version this pull request publishes: a
      # vulnerable dependency stops the release before the merge.
      - name: Install cargo-audit
        if: steps.guard.outputs.skip != 'true'
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit@0.22.2

      - name: Audit the dependencies
        if: steps.guard.outputs.skip != 'true'
        run: cargo audit

      - name: Sync the plugin snapshot
        if: steps.guard.outputs.skip != 'true'
        run: |
          cargo run -p rusteal -- sync-plugin
          test -f rusteal-cli/ue_plugin_embed/Rusteal/Rusteal.uplugin

      # Builds every crate from the package crates.io will receive, against the
      # other crates' packages at this version, which are not on crates.io yet:
      # what cargo publish checks, without publishing. The Cargo the workspace
      # pins cannot package crates whose dependencies are unpublished; the
      # stable one can.
      - name: Package every crate as it will be published
        if: steps.guard.outputs.skip != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable package --workspace --exclude xtask --allow-dirty

      # The version commit pushed above is now the head of the pull request,
      # and it creates no runs of its own. This job has just run on it what the
      # CI checks (build, tests, clippy, the dependency audit) and what the
      # release needs, so it reports both checks a pull request to main must
      # pass on that commit.
      - name: Report the checks on the version commit
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for CONTEXT in build bump; do
            gh api "repos/${{ github.repository }}/statuses/$SHA" \
              -f state=success -f context="$CONTEXT" \
              -f description="Checked by Prepare release on this commit" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          done
